<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">人工签核的版本化路径</title><desc id="desc">机器基线经过逐条复核和填写依据生成签核版本，版本号、审核人和时间进入审计记录。</desc>
  <rect width="1200" height="675" fill="#fff"/>
  <g font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="96" y="88" fill="#111" font-size="34" font-weight="700">机器给基线，人来逐条签核</text>
    <text x="96" y="124" fill="#666" font-size="16">原始结果不被覆盖，每次修改都有审核人、时间和理由</text>
    <line x1="96" y1="184" x2="1104" y2="184" stroke="#E8E8E8"/>
    <line x1="160" y1="344" x2="1038" y2="344" stroke="#222" stroke-width="1.5"/>
    <path d="M1030 338 L1040 344 L1030 350" fill="none" stroke="#222" stroke-width="1.5"/>
    <g text-anchor="middle">
      <circle cx="214" cy="344" r="10" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="214" y="298" fill="#111" font-size="19" font-weight="700">机器基线</text><text x="214" y="388" fill="#666" font-size="14">只读保留</text>
      <circle cx="458" cy="344" r="10" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="458" y="298" fill="#111" font-size="19" font-weight="700">逐条复核</text><text x="458" y="388" fill="#666" font-size="14">不改总分</text>
      <circle cx="702" cy="344" r="10" fill="#fff" stroke="#222" stroke-width="1.5"/><text x="702" y="298" fill="#111" font-size="19" font-weight="700">填写依据</text><text x="702" y="388" fill="#666" font-size="14">确认或修正</text>
      <circle cx="946" cy="344" r="34" fill="#fff" stroke="#2F6BFF" stroke-width="2"/><circle cx="946" cy="344" r="6" fill="#2F6BFF"/><text x="946" y="276" fill="#111" font-size="21" font-weight="700">生成签核版</text><text x="946" y="410" fill="#666" font-size="14">revision + 1</text>
    </g>
    <path d="M946 378 C946 468 778 486 610 486 C442 486 274 468 274 420" fill="none" stroke="#2F6BFF" stroke-width="1.5" stroke-dasharray="6 8"/>
    <text x="610" y="522" text-anchor="middle" fill="#2F6BFF" font-size="15" font-weight="600">版本 · 审核人 · 时间 · 理由</text>
    <text x="96" y="596" fill="#999" font-size="13">没有“批量拒绝”接口；任何业务流转都必须由部署方另行建立人工流程。</text>
  </g>
</svg>
