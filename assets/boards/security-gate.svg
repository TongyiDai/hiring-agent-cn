<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">可疑内容先隔离</title><desc id="desc">白底字、透明字、微小字、覆盖层和提示注入经过多信号检测，被隔离并留痕，只有可信证据进入后续流程。</desc>
  <rect width="1200" height="675" fill="#fff"/>
  <g font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="96" y="88" fill="#111" font-size="34" font-weight="700">可疑内容先隔离，不让它碰到模型</text>
    <text x="96" y="124" fill="#666" font-size="16">可见性和指令性独立检测，任何一项命中都会留下审计记录</text>
    <line x1="96" y1="184" x2="1104" y2="184" stroke="#E8E8E8"/>

    <g fill="#111" font-size="16">
      <circle cx="142" cy="250" r="5" fill="#999"/><text x="166" y="256">白底字</text>
      <circle cx="142" cy="314" r="5" fill="#999"/><text x="166" y="320">透明字</text>
      <circle cx="142" cy="378" r="5" fill="#999"/><text x="166" y="384">微小字</text>
      <circle cx="142" cy="442" r="5" fill="#999"/><text x="166" y="448">覆盖层</text>
      <circle cx="142" cy="506" r="5" fill="#999"/><text x="166" y="512">指令注入</text>
    </g>
    <g stroke="#B8B8B8" fill="none">
      <line x1="250" y1="250" x2="432" y2="330"/><line x1="250" y1="314" x2="432" y2="330"/>
      <line x1="250" y1="378" x2="432" y2="330"/><line x1="250" y1="442" x2="432" y2="330"/>
      <line x1="250" y1="506" x2="432" y2="330"/>
    </g>
    <rect x="432" y="252" width="210" height="156" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <text x="537" y="315" text-anchor="middle" fill="#111" font-size="22" font-weight="700">多信号检测</text>
    <text x="537" y="350" text-anchor="middle" fill="#666" font-size="14">颜色 · 透明度 · 字号</text>
    <text x="537" y="376" text-anchor="middle" fill="#666" font-size="14">位置 · 遮挡 · 文本意图</text>
    <path d="M642 315 C724 248 780 236 844 250" fill="none" stroke="#222" stroke-width="1.5"/>
    <path d="M836 244 L846 250 L835 255" fill="none" stroke="#222" stroke-width="1.5"/>
    <text x="930" y="234" text-anchor="middle" fill="#111" font-size="21" font-weight="700">可信证据</text>
    <line x1="854" y1="250" x2="1006" y2="250" stroke="#2F6BFF" stroke-width="2"/>
    <circle cx="1006" cy="250" r="6" fill="#2F6BFF"/>
    <path d="M642 346 C724 422 776 452 844 466" fill="none" stroke="#222" stroke-width="1.5"/>
    <path d="M835 459 L846 466 L834 470" fill="none" stroke="#222" stroke-width="1.5"/>
    <rect x="844" y="414" width="210" height="104" fill="#F5F5F5" stroke="#2F6BFF" stroke-width="1.5"/>
    <circle cx="874" cy="446" r="6" fill="#2F6BFF"/>
    <text x="904" y="453" fill="#111" font-size="21" font-weight="700">隔离并留痕</text>
    <text x="874" y="488" fill="#666" font-size="14">页码 · 坐标 · 原因 · 哈希</text>
    <text x="96" y="586" fill="#999" font-size="13">检测器失效时降级并告警，不把探针异常伪装成“安全”。</text>
  </g>
</svg>
