<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">从候选人材料到人工决定</title>
  <desc id="desc">候选人材料和确认后的岗位经过安全隐私闸门形成证据矩阵，再生成核验问题，最终由人作决定。</desc>
  <rect width="1200" height="675" fill="#fff"/>
  <g font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="96" y="88" fill="#111" font-size="34" font-weight="700">从材料到决定，中间必须经过证据</text>
    <text x="96" y="124" fill="#666" font-size="16">系统负责整理和追问，录用判断始终由人完成</text>
    <line x1="96" y1="184" x2="1104" y2="184" stroke="#E8E8E8"/>

    <g transform="translate(104 244)">
      <rect x="0" y="0" width="210" height="72" fill="#F5F5F5" stroke="#B8B8B8"/>
      <text x="24" y="43" fill="#111" font-size="18" font-weight="600">候选人材料</text>
      <rect x="0" y="112" width="210" height="72" fill="#F5F5F5" stroke="#B8B8B8"/>
      <text x="24" y="155" fill="#111" font-size="18" font-weight="600">确认后的岗位</text>
    </g>

    <path d="M314 280 C364 280 366 326 416 326" fill="none" stroke="#999" stroke-width="1.5"/>
    <path d="M314 392 C364 392 366 346 416 346" fill="none" stroke="#999" stroke-width="1.5"/>
    <circle cx="416" cy="336" r="5" fill="#2F6BFF"/>

    <g transform="translate(432 240)">
      <rect x="0" y="0" width="184" height="192" fill="#fff" stroke="#222" stroke-width="1.5"/>
      <line x1="24" y1="64" x2="160" y2="64" stroke="#E8E8E8"/>
      <text x="92" y="42" text-anchor="middle" fill="#111" font-size="19" font-weight="700">安全与隐私闸门</text>
      <text x="92" y="98" text-anchor="middle" fill="#666" font-size="14">隔离可疑内容</text>
      <text x="92" y="128" text-anchor="middle" fill="#666" font-size="14">隐藏身份字段</text>
      <text x="92" y="158" text-anchor="middle" fill="#666" font-size="14">保留原文位置</text>
    </g>

    <line x1="616" y1="336" x2="694" y2="336" stroke="#222" stroke-width="1.5"/>
    <path d="M686 330 L696 336 L686 342" fill="none" stroke="#222" stroke-width="1.5"/>
    <circle cx="774" cy="336" r="78" fill="#fff" stroke="#2F6BFF" stroke-width="2"/>
    <circle cx="774" cy="336" r="6" fill="#2F6BFF"/>
    <text x="774" y="326" text-anchor="middle" fill="#111" font-size="21" font-weight="700">证据矩阵</text>
    <text x="774" y="362" text-anchor="middle" fill="#666" font-size="13">要求 × 原文 × 置信度</text>

    <line x1="852" y1="336" x2="926" y2="336" stroke="#222" stroke-width="1.5"/>
    <path d="M918 330 L928 336 L918 342" fill="none" stroke="#222" stroke-width="1.5"/>
    <text x="980" y="302" text-anchor="middle" fill="#666" font-size="14">核验问题</text>
    <circle cx="980" cy="336" r="9" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <line x1="980" y1="345" x2="980" y2="398" stroke="#222" stroke-width="1.5"/>
    <line x1="954" y1="367" x2="1006" y2="367" stroke="#222" stroke-width="1.5"/>
    <line x1="980" y1="398" x2="958" y2="426" stroke="#222" stroke-width="1.5"/>
    <line x1="980" y1="398" x2="1002" y2="426" stroke="#222" stroke-width="1.5"/>
    <text x="980" y="466" text-anchor="middle" fill="#111" font-size="19" font-weight="700">人工决定</text>
    <text x="96" y="586" fill="#999" font-size="13">没有证据 ≠ 不具备；它只意味着需要进一步确认。</text>
  </g>
</svg>
