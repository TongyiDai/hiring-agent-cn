[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hiring-agent-cn"
version = "1.0.1"
description = "Evidence-first, human-reviewed resume and job matching for mainland China"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "HackerRank contributors" },
  { name = "Hiring Agent CN contributors" },
]
keywords = ["recruiting", "resume", "china", "evidence", "privacy", "security"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "pydantic>=2.11,<3",
  "pymupdf>=1.26.3,<2",
  "python-docx>=1.1,<2",
  "python-dotenv>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "requests>=2.32.5,<3",
  "typer>=0.17,<1",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
ocr = [
  "paddleocr>=3.1,<4",
  "paddlepaddle>=3.1,<4; platform_machine != 'x86_64' or sys_platform != 'darwin'",
]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=7,<8",
  "ruff>=0.12,<1",
]
legacy = [
  "pymupdf4llm>=0.0.27,<1",
]

[project.scripts]
hiring-agent-cn = "hiring_agent_cn.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["hiring_agent_cn"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --cov=hiring_agent_cn --cov-report=term-missing --cov-fail-under=75"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 96

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
check_untyped_defs = true
ignore_missing_imports = true
